<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sundered Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<!-- Load order matters: plain scripts sharing one global scope, no build step. -->
<script src="js/cloudsave.js"></script>
<script src="js/core.js"></script>
<script src="js/heroes/kael/ch1.js"></script>
<script src="js/heroes/ilsa/ch1.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/saves.js"></script>
<script src="js/heroes/tamsin/ch1.js"></script>
<script src="js/heroes/wren/ch1.js"></script>
<script src="js/chapters.js"></script>
<script src="js/party.js"></script>
<!-- Later chapters go here, after chapters.js: js/heroes/<hero>/ch2.js, ch3.js -->
<script src="js/heroes/ilsa/ch2.js"></script>
<script src="js/heroes/tamsin/ch2.js"></script>
<script src="js/heroes/kael/ch2.js"></script>
<script src="js/heroes/wren/ch2.js"></script>
<script src="js/heroes/kael/ch3.js"></script>
<script src="js/heroes/ilsa/ch3.js"></script>
<script src="js/heroes/tamsin/ch3.js"></script>
<script src="js/heroes/wren/ch3.js"></script>
<!-- Act 2 party chapters load after every hero chapter (they read all four heroes' flags) -->
<script src="js/party/ch1.js"></script>
<script src="js/party/ch2.js"></script>
<script src="js/party/ch3.js"></script>
<script src="js/party/ch4.js"></script>
<script src="js/pairs/s1.js"></script>
<script src="js/pairs/w1.js"></script>
<script src="js/pairs/s2.js"></script>
<script src="js/main.js"></script>
<!-- Firebase (Google sign-in + Firestore) loads as a module after the game; cloudsave.js waits for it. -->
<script type="module" src="js/firebase.js"></script>
</body>
</html>
